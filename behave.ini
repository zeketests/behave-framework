[behave]
# Skip unfinished scenarios by default; run them with: behave --tags=@wip
default_tags = -@wip

[behave.userdata]
# Override any of these with: behave -D key=value
browser = firefox
headless = false
implicit_wait = 10
base_url = https://registry.qa.covid.gcp.rexdb.us
# Optional path to a specific browser executable
browser_binary =
